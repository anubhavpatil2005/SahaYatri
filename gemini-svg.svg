<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient Mix -->
    <linearGradient id="flightTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="roadPath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Card preview (Optional) -->
  <rect width="800" height="300" rx="24" fill="#0F172A" />

  <!-- Logo Mark Container -->
  <g transform="translate(70, 50)">
    <!-- Flight Arc (S-Top) -->
    <path d="M 20,120 C 30,50 90,30 140,40 C 180,48 190,80 150,110 C 120,132 80,140 60,180" 
          fill="none" stroke="url(#flightTrail)" stroke-width="12" stroke-linecap="round"/>
          
    <!-- Road Arc (S-Bottom) -->
    <path d="M 150,60 C 130,110 80,115 60,140 C 40,165 70,185 110,180 C 160,175 180,140 185,110" 
          fill="none" stroke="url(#roadPath)" stroke-width="12" stroke-linecap="round"/>

    <!-- Center Connection Pulse Point -->
    <circle cx="108" cy="122" r="10" fill="#FFFFFF" />
    <circle cx="108" cy="122" r="18" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.6"/>

    <!-- Airplane Jet Point -->
    <polygon points="140,30 152,42 135,46" fill="#06B6D4" />
  </g>

  <!-- Typography Section -->
  <g transform="translate(290, 130)">
    <!-- Primary Brand Name -->
    <text x="0" y="0" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Saha<tspan fill="#10B981">Yatri</tspan>
    </text>
    
    <!-- Marathi Script Subtext -->
    <text x="5" y="42" font-family="'Kohinoor Devanagari', 'Mukta', sans-serif" font-size="28" font-weight="600" fill="#F59E0B" letter-spacing="1">
      सहयात्री
    </text>

    <!-- Tagline -->
    <text x="140" y="40" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="2">
      • SMART AIRPORT POOLING
    </text>
  </g>
</svg>
